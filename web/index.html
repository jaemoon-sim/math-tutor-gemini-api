<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Tutor Demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div>
            <h1>Math Tutor</h1>
            <p>Gemini 풀이 데모</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-header">
            <h2>진도현황</h2>
            <button class="icon-button" id="reset-profiles" title="기본값 다시 불러오기" type="button">↻</button>
          </div>
          <label class="field">
            <span>선택</span>
            <select id="profile-select"></select>
          </label>
          <div class="profile-meta" id="profile-meta"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>새 진도</h2>
          </div>
          <form id="profile-form" class="stack">
            <label class="field">
              <span>이름</span>
              <input id="profile-name" name="name" autocomplete="off" placeholder="예: 고1 공통수학2" />
            </label>
            <label class="field">
              <span>Markdown</span>
              <textarea id="profile-md" name="markdown" rows="12" spellcheck="false"></textarea>
            </label>
            <div class="actions">
              <button type="submit">저장</button>
              <button type="button" id="delete-profile" class="secondary">삭제</button>
            </div>
          </form>
        </section>
      </aside>

      <main class="workspace">
        <section class="solve-band">
          <div>
            <h2>문제 풀이</h2>
            <p id="status-line">대기 중</p>
          </div>
          <form id="solve-form" class="solve-form">
            <label class="file-drop" for="image-file">
              <input id="image-file" name="image_file" type="file" accept="image/*" />
              <span id="file-label">이미지 선택</span>
            </label>
            <button type="submit" id="solve-button">풀이 요청</button>
          </form>
        </section>

        <section class="content-grid">
          <div class="preview-pane">
            <div class="pane-header">
              <h3>문제 이미지</h3>
            </div>
            <div class="image-preview" id="image-preview">
              <span>선택된 이미지 없음</span>
            </div>
          </div>

          <div class="result-pane">
            <div class="result-summary" id="result-summary">
              <div>
                <span class="label">단원</span>
                <strong id="summary-topic">-</strong>
              </div>
              <div>
                <span class="label">신뢰도</span>
                <strong id="summary-confidence">-</strong>
              </div>
              <div>
                <span class="label">확인 필요</span>
                <strong id="summary-check">-</strong>
              </div>
            </div>

            <div class="tabs" role="tablist">
              <button class="tab active" data-tab="solution" type="button">풀이</button>
              <button class="tab" data-tab="notebook" type="button">오답노트</button>
              <button class="tab" data-tab="raw" type="button">JSON</button>
            </div>

            <article class="tab-panel active" id="tab-solution">
              <div class="empty-state">결과 없음</div>
            </article>
            <article class="tab-panel" id="tab-notebook">
              <div class="empty-state">복습 항목 없음</div>
            </article>
            <article class="tab-panel" id="tab-raw">
              <pre class="json-output">{}</pre>
            </article>
          </div>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
